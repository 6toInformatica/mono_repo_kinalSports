# Workspace propio para instalar client-user solo (Docker) con su lockfile
allowBuilds:
  "@parcel/watcher": true
  "@scarf/scarf": false
minimumReleaseAgeExclude:
  - "@expo/cli@58.1.22"
  - "@expo/config-plugins@58.0.14"
  - "@expo/config@58.0.13"
  - "@expo/fingerprint@0.22.0"
  - "@expo/inline-modules@0.2.11"
  - "@expo/local-build-cache-provider@58.0.13"
  - "@expo/metro-config@58.0.24"
  - "@expo/metro-file-map@58.0.7"
  - "@expo/prebuild-config@58.0.21"
  - "@expo/router-server@58.0.24"
  - babel-preset-expo@58.0.27
  - expo-file-system@58.0.15
  - expo-modules-core@58.2.0
  - expo-modules-jsi@58.0.24
  - expo@58.1.0
  - expo-splash-screen@58.0.15
  - jest-expo@58.0.16
overrides:
  minimatch: ^11.0.1
  # glob 9-13 (de test-exclude, @expo/cli y @expo/fingerprint): GHSA-3g3m-2fjr-6pw4, corregido en 14.0.2
  glob@>=9.0.0 <14.0.2: ^14.0.4
  # node-forge (de @expo/cli): GHSA-w4xr-hqv8-ch44, GHSA-6cv4-p8m7-4r25, GHSA-j8rw-jp99-435v y GHSA-6889-vf6x-f3g5, corregidos en 1.4.3
  node-forge@<1.4.3: ^1.4.3

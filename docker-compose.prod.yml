# Orquestación de Producción (100% Node.js, sin runtime de .NET)
# En producción auth-node atiende tanto el stack móvil/usuario como el stack admin,
# e inicializa automáticamente el esquema de PostgreSQL, los roles y el admin inicial.
name: kinal-sports-prod

services:
  postgres:
    image: postgres:18
    container_name: pg-kinal-sports
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Define POSTGRES_USER en .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:-kinal_sports}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-kinal_sports}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - kinal-network

  mongodb:
    image: mongo:7
    container_name: kinal_mongodb
    restart: always
    ports:
      - "${MONGODB_PORT:-27020}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kinal-network

  redis:
    image: redis:7-alpine
    container_name: kinal_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - kinal-network

  auth-node:
    build:
      context: ./authentication-service/auth-node
      dockerfile: ../../dockerfiles/Dockerfile.auth-node
      target: runtime
    container_name: kinal_auth_node
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3007
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-kinal_sports}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env.docker}
      JWT_ISSUER: ${JWT_ISSUER:-AuthService}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-AuthService}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?Define INTERNAL_SERVICE_TOKEN en .env.docker}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-kmh}
      KMH_API_BASE_URL: ${KMH_API_BASE_URL:-https://mail.lab.kinal.edu.gt}
      KMH_MAIL_FROM: ${KMH_MAIL_FROM:-kinal-sports@am-delta.in6am.mail.kinal.test}
      KMH_PROJECT_API_KEY: ${KMH_PROJECT_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_ENABLE_SSL: ${SMTP_ENABLE_SSL:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Kinal Sports Support}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-b3xvlule}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_BASE_URL: ${CLOUDINARY_BASE_URL:-https://res.cloudinary.com/b3xvlule/image/upload/}
      CLOUDINARY_FOLDER: ${CLOUDINARY_FOLDER:-auth_service/profiles}
      CLOUDINARY_DEFAULT_AVATAR_FILENAME: ${CLOUDINARY_DEFAULT_AVATAR_FILENAME:-avatarDefault-1749508519496_oam3k3}
    extra_hosts:
      - "mail.lab.kinal.edu.gt:${KMH_HOST_IP:-181.114.7.76}"
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "${AUTH_NODE_PORT:-3007}:3007"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3007/api/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kinal-network

  server-admin:
    build:
      context: ./server-admin
      dockerfile: ../dockerfiles/Dockerfile.server-admin
      target: runtime
    container_name: kinal_server_admin
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      auth-node:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3009
      URI_MONGODB: mongodb://mongodb:27017/${MONGO_DB_NAME:-kinalSports}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-AuthService}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-AuthService}
      ADMIN_ALLOWED_ORIGINS: ${ADMIN_ALLOWED_ORIGINS:-${FRONTEND_URL:-http://localhost:5173}}
      # En producción server-admin consulta perfiles en auth-node (intercambiable con auth-service)
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL:-http://auth-node:3007/api/v1}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-b3xvlule}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "${SERVER_ADMIN_PORT:-3009}:3009"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3009/kinalSportsAdmin/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kinal-network

  server-user:
    build:
      context: ./server-user
      dockerfile: ../dockerfiles/Dockerfile.server-user
      target: runtime
    container_name: kinal_server_user
    restart: always
    depends_on:
      mongodb:
        condition: service_healthy
      auth-node:
        condition: service_healthy
      server-admin:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3008
      URI_MONGODB: mongodb://mongodb:27017/${MONGO_DB_NAME:-kinalSports}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-AuthService}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-AuthService}
      ADMIN_SERVICE_URL: http://server-admin:3009/kinalSportsAdmin/v1
      AUTH_NODE_URL: ${AUTH_NODE_URL:-http://auth-node:3007/api/v1}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-b3xvlule}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      CLOUDINARY_TEAMS_FOLDER: ${CLOUDINARY_TEAMS_FOLDER:-kinal_sports/teams}
    env_file:
      - path: .env.docker
        required: false
    ports:
      - "${SERVER_USER_PORT:-3008}:3008"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3008/kinalSportsUser/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - kinal-network

  client-admin:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.client-admin
      target: runtime
      args:
        VITE_AUTH_URL: ${VITE_AUTH_URL:-http://localhost:3007/api/v1}
        VITE_ADMIN_URL: ${VITE_ADMIN_URL:-http://localhost:3009/kinalSportsAdmin/v1}
        VITE_CLOUDINARY_BASE_URL: ${VITE_CLOUDINARY_BASE_URL:-https://res.cloudinary.com/b3xvlule/image/upload/}
    container_name: kinal_client_admin
    restart: always
    depends_on:
      auth-node:
        condition: service_healthy
      server-admin:
        condition: service_healthy
    ports:
      - "${CLIENT_ADMIN_PORT:-5173}:8080"
    networks:
      - kinal-network

  client-admin-next:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.client-admin-next
      target: runtime
    container_name: kinal_client_admin_next
    restart: always
    depends_on:
      auth-node:
        condition: service_healthy
      server-admin:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # En producción el BFF de Next.js habla con auth-node
      AUTH_API_URL: ${AUTH_API_URL:-http://auth-node:3007/api/v1}
      ADMIN_API_URL: ${ADMIN_API_URL:-http://server-admin:3009/kinalSportsAdmin/v1}
      NEXT_PUBLIC_CLOUDINARY_BASE_URL: ${CLOUDINARY_BASE_URL:-https://res.cloudinary.com/b3xvlule/image/upload/}
    ports:
      - "${CLIENT_ADMIN_NEXT_PORT:-3000}:3000"
    networks:
      - kinal-network

networks:
  kinal-network:
    driver: bridge

volumes:
  postgres18_data:
  mongo_data:
  redis_data:

# SPA + PWA de client-admin (nginxinc/nginx-unprivileged, puerto 8080)
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cabeceras de seguridad básicas (sin CSP estricto: la SPA carga fuentes y Cloudinary)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Service worker: nunca cachear (autoUpdate de Workbox)
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    add_header Content-Type "application/manifest+json" always;
    try_files $uri =404;
  }

  # Workbox runtime (hash en el nombre): cacheable a largo plazo
  location ~* ^/workbox-.*\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Assets con hash de Vite
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Íconos PWA / favicon
  location ~* \.(?:png|svg|ico|webp)$ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

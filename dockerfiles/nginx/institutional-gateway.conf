# Gateway institucional CSR (nginxinc/nginx-unprivileged, puerto 8080)
# - Sirve la SPA/PWA de client-admin (estáticos)
# - Proxifica solo los prefijos públicos de API hacia la red Docker privada
# - No publica auth-node, server-admin ni server-user en el host
#
# HestiaCP debe hacer proxy HTTPS de ks-csr.lab.kinal.edu.gt → 127.0.0.1:33001
# y reenviar X-Forwarded-Proto / X-Forwarded-For.
#
# Resolución DNS en tiempo de petición (127.0.0.11 = Docker embedded DNS)
# para tolerar reinicios de auth-node/server-admin sin recargar Nginx.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  # Cabeceras de seguridad básicas (sin CSP estricto: fuentes + Cloudinary)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/manifest+json
    image/svg+xml;

  # Endpoints solo-servicio (requieren x-internal-token). Bloqueo en el borde
  # para que el navegador no pueda alcanzarlos aunque conozca la ruta.
  location = /api/v1/auth/profile/by-id {
    default_type application/json;
    return 404 '{"success":false,"message":"Not found"}';
  }

  location = /api/v1/auth/profile/by-username {
    default_type application/json;
    return 404 '{"success":false,"message":"Not found"}';
  }

  # Auth API (mismo origen para la SPA: VITE_AUTH_URL=/api/v1)
  location /api/v1/ {
    set $auth_upstream http://auth-node:3007;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_pass $auth_upstream;
    proxy_read_timeout 60s;
  }

  # Admin API (mismo origen: VITE_ADMIN_URL=/kinalSportsAdmin/v1)
  location /kinalSportsAdmin/v1/ {
    set $admin_upstream http://server-admin:3009;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 15m;
    proxy_pass $admin_upstream;
    proxy_read_timeout 120s;
  }

  # User API. proxy_pass con variable y sin ruta propia reenvía el URI completo,
  # así Express sigue recibiendo el prefijo /kinalSportsUser/v1/.
  # 15m cubre las fotos (multer admite 10 MB) de perfil y de equipo.
  location /kinalSportsUser/v1/ {
    set $user_upstream http://server-user:3008;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    client_max_body_size 15m;
    proxy_pass $user_upstream;
    proxy_read_timeout 120s;
  }

  # Service worker: nunca cachear (autoUpdate de Workbox)
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    add_header Content-Type "application/manifest+json" always;
    try_files $uri =404;
  }

  location ~* ^/workbox-.*\.js$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location ~* \.(?:png|svg|ico|webp)$ {
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
  }

  # Health del gateway (estáticos + nginx vivos)
  location = /healthz {
    default_type application/json;
    return 200 '{"status":"ok","service":"institutional-gateway"}';
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
